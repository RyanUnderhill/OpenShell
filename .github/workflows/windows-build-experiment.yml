name: Windows Build Experiment

on:
  push:
    branches:
      - codex/windows-ci-experiment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  windows-build:
    name: Windows x64 build and unit tests
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure MinGW build tools
        shell: pwsh
        run: |
          $mingwBin = 'C:\mingw64\bin'
          $gcc = Join-Path $mingwBin 'gcc.exe'

          if (-not (Test-Path $gcc)) {
            throw 'The GitHub Windows image does not contain the expected MinGW compiler.'
          }

          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:/mingw64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:/mingw64/bin/g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'MAKE=C:/mingw64/bin/make.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $gcc --version

      - name: Show Rust environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          gcc --version
          make --version

      - name: Build workspace
        shell: pwsh
        run: cargo build --workspace --locked

      - name: Run workspace unit tests
        shell: pwsh
        run: cargo test --workspace --locked
