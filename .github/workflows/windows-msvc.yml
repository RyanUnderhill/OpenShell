name: Windows MSVC (build-only)
on:
  push:
    branches:
      - main
      - codex/windows-ci-pr2496
  workflow_dispatch:
  pull_request:
jobs:
  mxc-runner-probe:
    name: NVIDIA managed Windows x64 MXC probe
    runs-on: windows-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Inspect managed Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $os = Get-CimInstance Win32_OperatingSystem
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          Write-Host "OS: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Identity: $($identity.Name)"
          Write-Host "Administrator: $isAdmin"

          $containers = Get-WindowsOptionalFeature -Online -FeatureName Containers -ErrorAction SilentlyContinue
          Write-Host "Containers feature: $($containers.State)"

          $isoSessionPaths = @(
            "$env:WINDIR\System32\IsoSessionApp.dll",
            "$env:WINDIR\SysWOW64\IsoSessionApp.dll"
          )
          foreach ($path in $isoSessionPaths) {
            Write-Host "IsoSessionApp candidate: $path (exists=$(Test-Path -LiteralPath $path))"
          }

          $wxcCandidates = @(
            "C:\mxc\wxc-exec.exe",
            "C:\mxc-kit\bin\wxc-exec.exe"
          )
          $wxcOnPath = Get-Command wxc-exec.exe -ErrorAction SilentlyContinue
          if ($wxcOnPath) {
            $wxcCandidates += $wxcOnPath.Source
          }

          $wxc = $wxcCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($wxc) {
            Write-Host "wxc-exec: $wxc"
            & $wxc --version
          } else {
            Write-Host "wxc-exec: not installed"
          }

  x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
          experimental: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: mise run --skip-tools windows:check:x64
      - run: mise run --skip-tools windows:build:x64
      - run: mise run --skip-tools windows:test:x64
      - run: mise run --skip-tools windows:test:unsupported:x64
  arm64:
    # TODO: provision a windows-arm64 self-hosted runner
    runs-on: [self-hosted, windows-arm64]
    if: false # flip to true once the runner is online
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
          experimental: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: mise run --skip-tools windows:check:arm64
      - run: mise run --skip-tools windows:build:arm64
